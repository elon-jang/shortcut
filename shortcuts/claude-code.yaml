app: Claude Code
shortcuts:
  - section: Session
    items:
      - shortcut: Ctrl+Z
        description: 잠깐 멈추고 터미널 쓰기 (백그라운드 전환, fg로 복귀)
        tip: "Unix 표준 suspend. 복귀는 터미널에서 'fg' 입력"
      - shortcut: Esc+Esc
        description: 코드 + 대화 함께 롤백 (Rewind)
        tip: "두 번 눌러야 코드+대화 모두 롤백. 한 번은 취소만"

  - section: Input
    items:
      - shortcut: "!"
        description: Bash 모드 전환 (입력창에서 터미널 명령어 직접 실행)
        tip: "! = bang. 쉘에서 명령어 앞에 붙이는 기호"
      - shortcut: Ctrl+G
        description: 멀티라인 편집 (에디터 열기)
        tip: "G = Get editor (긴 프롬프트 작성 시 유용)"
      - shortcut: Ctrl+S
        description: 프롬프트 임시 저장 (Stash/Unstash)
        tip: "S = Stash. 다시 누르면 복원"

  - section: Editing
    items:
      - shortcut: Ctrl+W
        description: 단어 단위 삭제
        tip: "W = Word. Unix/bash 표준 단축키"
      - shortcut: Ctrl+A
        description: 줄 처음으로 이동
        tip: "A = 알파벳 첫 글자 → 줄의 처음"
      - shortcut: Ctrl+E
        description: 줄 끝으로 이동
        tip: "E = End"
